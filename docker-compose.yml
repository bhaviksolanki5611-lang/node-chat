# Local full stack: MySQL + Redis + Firestore emulator + API
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chat_app
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["mysql-data:/var/lib/mysql"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=demo-chat
    ports: ["8080:8080"]

  api:
    build: .
    command: sh -c "node dist/migrate.js && node dist/server.js"
    ports: ["3000:3000"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      firestore: { condition: service_started }
    environment:
      NODE_ENV: development # enables /auth/dev-token and POST /user for local testing
      LOG_LEVEL: info
      JWT_SECRET: local-dev-secret-local-dev-secret-1234
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: root
      REDIS_URL: redis://redis:6379
      FIRESTORE_EMULATOR_HOST: firestore:8080
      FIREBASE_PROJECT_ID: demo-chat

volumes:
  mysql-data:
